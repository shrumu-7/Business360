plugins { id 'com.android.application' }

android { namespace 'com.business360.trial'; compileSdk 35
    signingConfigs {
        debug {
            storeFile file('../business360-debug.keystore')
            storePassword 'business360'
            keyAlias 'business360'
            keyPassword 'business360'
        }
    }
    buildTypes { debug { signingConfig signingConfigs.debug } }
    defaultConfig { applicationId 'com.business360.trial'; minSdk 23; targetSdk 34; versionCode 15; versionName '1.3.0-trial-save-category-fixed' }
}

dependencies { implementation 'androidx.appcompat:appcompat:1.7.0'; implementation 'androidx.activity:activity:1.10.1'; implementation 'androidx.webkit:webkit:1.12.1' }
