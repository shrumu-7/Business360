name: Build Business360 Flutter APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: business360_flutter
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate Android and iOS platforms
        run: flutter create --platforms=android,ios --project-name business360 .

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze Dart source
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK
        run: |
          set -e
          test -s build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Business360-Flutter-APK-${{ github.run_number }}
          path: business360_flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
