name: Build Business360 Flutter Package

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'flutter-**'

permissions:
  contents: read

jobs:
  build-flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: business360_flutter
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Generate Android and iOS platforms
        run: flutter create --platforms=android,ios --project-name business360 .
      - name: Apply Business360 launcher icon
        run: |
          set -e
          test -s ../app/src/main/assets/branding/business360_logo.png
          mkdir -p android/app/src/main/res/drawable
          cp ../app/src/main/assets/branding/business360_logo.png android/app/src/main/res/drawable/business360_logo.png
          sed -i 's#android:icon="@mipmap/ic_launcher"#android:icon="@drawable/business360_logo"#' android/app/src/main/AndroidManifest.xml
          grep -q 'android:icon="@drawable/business360_logo"' android/app/src/main/AndroidManifest.xml
      - name: Remove generated default test
        run: rm -f test/widget_test.dart
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze Dart source
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings
      - name: Run Flutter tests
        run: flutter test
      - name: Build Android APKs
        run: flutter build apk --release --split-per-abi
      - name: Build Android App Bundle
        run: flutter build appbundle --release
      - name: Verify Android artifacts
        run: |
          set -e
          test -s build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          test -s build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          test -s build/app/outputs/flutter-apk/app-x86_64-release.apk
          test -s build/app/outputs/bundle/release/app-release.aab
          ls -lh build/app/outputs/flutter-apk/*.apk
          ls -lh build/app/outputs/bundle/release/app-release.aab
      - name: Package complete Flutter project
        working-directory: .
        run: |
          set -e
          zip -r -9 Business360-Flutter-Project-${{ github.run_number }}.zip business360_flutter \
            -x 'business360_flutter/.dart_tool/*' \
               'business360_flutter/build/*' \
               'business360_flutter/.git/*'
      - name: Upload complete package
        uses: actions/upload-artifact@v4
        with:
          name: Business360-Flutter-Package-${{ github.run_number }}
          path: |
            Business360-Flutter-Project-${{ github.run_number }}.zip
            business360_flutter/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            business360_flutter/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            business360_flutter/build/app/outputs/flutter-apk/app-x86_64-release.apk
            business360_flutter/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
