name: Build Business360 V53 Final APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check V53 ZIP
        run: |
          set -e
          test -f "Business360_V53_FUNCTIONAL_FIX_FINAL(1).zip"
          echo "V53 ZIP found."

      - name: Extract V53 project
        run: |
          set -e
          rm -rf v53_project
          mkdir v53_project
          unzip -q "Business360_V53_FUNCTIONAL_FIX_FINAL(1).zip" -d v53_project

          echo "Searching for Android project..."
          SETTINGS=$(find v53_project -name settings.gradle -o -name settings.gradle.kts | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "V53 project found at: $PROJECT_DIR"

      - name: Verify V53 source
        run: |
          set -e

          test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/app/src/main/assets/index.html"

          grep -q "versionCode 15" "$PROJECT_DIR/app/build.gradle"
          grep -q "com.business360.trial" "$PROJECT_DIR/app/build.gradle"

          grep -q "function partyOptions" "$PROJECT_DIR/app/src/main/assets/index.html"
          grep -q "const nextNo" "$PROJECT_DIR/app/src/main/assets/index.html"
          grep -q "function addMove" "$PROJECT_DIR/app/src/main/assets/index.html"
          grep -q "function transactionsPage" "$PROJECT_DIR/app/src/main/assets/index.html"
          grep -q "Md Sahadul Hoque Rumu" "$PROJECT_DIR/app/src/main/assets/index.html"

          echo "V53 source verification PASSED."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build V53 APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle --no-daemon clean assembleDebug --stacktrace

      - name: Verify APK
        run: |
          set -e

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "V53 APK created successfully."
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload V53 APK
        uses: actions/upload-artifact@v4
        with:
          name: Business360-Trial-v53-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
