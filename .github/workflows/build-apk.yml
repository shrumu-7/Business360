name: Build Business360 APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply final fixes
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/src/main/assets/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<div class="brand" id="brand">আমার দোকান</div>','<div class="brand" id="brand">Business360</div>')
          s=s.replace('settings:{shop:"আমার দোকান",','settings:{shop:"Business360",')
          s=s.replace('||"আমার দোকান";','||"Business360";')
          s=s.replace('sw.js?v=50','sw.js?v=55')
          s=s.replace('bottom:86px;z-index:45','bottom:76px;z-index:10000')
          s=s.replace('@media(max-width:600px){.save-bar{bottom:86px;','@media(max-width:600px){.save-bar{bottom:76px;')
          # Fix the actual theme application function. The previous build only expanded a CSS/file allow-list;
          # the runtime applyTheme() still rejected the new theme names and did not apply whole-app backgrounds.
          new_apply = '''function applyTheme(t, silent=false){
 const maps={
  purple:{bg:'#f7f7fb',dash:'purple',panel:'auto',product:'auto'},blue:{bg:'#f5f8ff',dash:'blue',panel:'auto',product:'auto'},green:{bg:'#effcf6',dash:'green',panel:'emerald',product:'green'},rose:{bg:'#fff4f8',dash:'wine',panel:'wine',product:'auto'},orange:{bg:'#fff7ed',dash:'sunset',panel:'gold',product:'auto'},dark:{bg:'#0b0d12',dash:'midnight',panel:'obsidian',product:'black'},sky:{bg:'#eefaff',dash:'blue',panel:'navy',product:'blue'},cream:{bg:'#fffaf0',dash:'warm',panel:'gold',product:'auto'},mint:{bg:'#effcf6',dash:'green',panel:'emerald',product:'green'},premium:{bg:'#f5f0ff',dash:'purple',panel:'plum',product:'purple'},light:{bg:'#f7fbff',dash:'blue',panel:'auto',product:'white'},ocean:{bg:'#e9fbff',dash:'blue',panel:'navy',product:'blue'},sunset:{bg:'#fff1e8',dash:'sunset',panel:'wine',product:'auto'},aurora:{bg:'#f2efff',dash:'aurora',panel:'plum',product:'purple'},forest:{bg:'#eefaf4',dash:'green',panel:'emerald',product:'green'},gold:{bg:'#fff9e8',dash:'warm',panel:'gold',product:'auto'}
 };
 if(!maps[t])t='purple';
 const m=maps[t],root=document.documentElement;
 root.dataset.theme=t;
 root.style.setProperty('--bg',m.bg);
 root.dataset.appbg=t;
 if(db&&db.settings){db.settings.theme=t;db.settings.appBg=t;db.settings.dashboardBg=m.dash;db.settings.panelBg=m.panel;db.settings.productBg=m.product;try{localStorage.setItem(KEY,JSON.stringify(db));}catch(_){}idbPut(db).catch(()=>{});}
 if(typeof applyDashboardStyle==='function')applyDashboardStyle();
 if(typeof applyPanelBg==='function')applyPanelBg(m.panel,true);
 if(typeof applyProductBg==='function')applyProductBg(m.product,true);
 if(!silent)toast('অ্যাপের All Theme: '+t);
}'''
          pattern=r'function applyTheme\(t, silent=false\)\{.*?\n\}'
          s,n=re.subn(pattern,new_apply,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('applyTheme function not found')
          # Make the first Settings theme picker use the same whole-app theme function.
          s=s.replace("function openThemePicker(){const names={purple:'পার্পল',blue:'ব্লু',green:'সবুজ',rose:'রোজ',orange:'অরেঞ্জ',dark:'ডার্ক',sky:'আকাশি',cream:'ক্রিম',mint:'মিন্ট'};", "function openThemePicker(){const names={purple:'পার্পল',blue:'ব্লু',green:'সবুজ',rose:'রোজ',orange:'অরেঞ্জ',dark:'ডার্ক',sky:'আকাশি',cream:'ক্রিম',mint:'মিন্ট',premium:'Premium',light:'Light',ocean:'Ocean',sunset:'Sunset',aurora:'Aurora',forest:'Forest',gold:'Gold'};")
          p.write_text(s,encoding='utf-8')
          g=Path('app/build.gradle'); t=g.read_text(encoding='utf-8')
          t=re.sub(r'versionCode\s+\d+','versionCode 18',t,count=1)
          t=re.sub(r"versionName\s+'[^']*'","versionName '1.6.0-all-theme-fix'",t,count=1)
          g.write_text(t,encoding='utf-8')
          PY
          mkdir -p app/src/main/assets/themes
          printf '%s\n' ':root{--theme-accent:#7c3aed;--theme-accent2:#ec4899}' > app/src/main/assets/themes/premium.css
          printf '%s\n' ':root{--theme-accent:#2563eb;--theme-accent2:#06b6d4}' > app/src/main/assets/themes/light.css
          printf '%s\n' ':root{--theme-accent:#0891b2;--theme-accent2:#2563eb}' > app/src/main/assets/themes/ocean.css
          printf '%s\n' ':root{--theme-accent:#f97316;--theme-accent2:#ec4899}' > app/src/main/assets/themes/sunset.css
          printf '%s\n' ':root{--theme-accent:#14b8a6;--theme-accent2:#8b5cf6}' > app/src/main/assets/themes/aurora.css
          printf '%s\n' ':root{--theme-accent:#16a34a;--theme-accent2:#0f766e}' > app/src/main/assets/themes/forest.css
          printf '%s\n' ':root{--theme-accent:#ca8a04;--theme-accent2:#b45309}' > app/src/main/assets/themes/gold.css
      - name: Verify final source
        run: |
          set -e
          test -f app/src/main/assets/index.html
          grep -q 'versionCode 18' app/build.gradle
          grep -q 'Business360</div>' app/src/main/assets/index.html
          grep -q 'sw.js?v=55' app/src/main/assets/index.html
          grep -q 'function partyOptions' app/src/main/assets/index.html
          grep -q 'const nextNo' app/src/main/assets/index.html
          grep -q 'function addMove' app/src/main/assets/index.html
          grep -q 'function transactionsPage' app/src/main/assets/index.html
          grep -q 'Md Sahadul Hoque Rumu' app/src/main/assets/index.html
          grep -q "app.settings.theme=t" app/src/main/assets/index.html
          grep -q "root.dataset.appbg=t" app/src/main/assets/index.html
          for f in premium light ocean sunset aurora forest gold; do test -f app/src/main/assets/themes/$f.css; done
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        run: gradle --no-daemon clean assembleDebug --stacktrace
      - name: Verify APK
        run: |
          set -e
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Business360-Trial-FINAL-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

# All Theme runtime fix