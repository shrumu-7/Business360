name: Build Business360 APK
on:
  workflow_dispatch:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply permanent UI fixes
        shell: bash
        run: |
          set -e
          python3 <<'PY'
          from pathlib import Path
          import re
          p=Path('app/src/main/assets/index.html')
          s=p.read_text(encoding='utf-8')
          old='<button class="btn" onclick="openThemePicker()">🎨 থিম পরিবর্তন</button>'
          new='<div class="toolbar"><button class="btn" onclick="openThemePicker()">🎨 থিম পরিবর্তন</button><button class="btn secondary" onclick="openThemePicker()">🎨 All Theme</button></div>'
          if old in s:
              s=s.replace(old,new,1)
          elif '🎨 All Theme' not in s:
              raise SystemExit('Settings theme button not found')
          old_contact='<div class="sub" style="margin-top:6px">WhatsApp: 01795934394 · Email: shrumu7@gmail.com</div>'
          new_contact='''<div class="about-contact" style="margin-top:10px;display:flex;gap:12px;flex-wrap:wrap;align-items:center"><a href="https://wa.me/8801795934394" style="text-decoration:none;color:inherit;display:inline-flex;align-items:center;gap:6px"><span aria-label="WhatsApp" style="display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#25D366;color:#fff;font-weight:900;font-size:17px">W</span><b>WhatsApp</b> · 01795934394</a><a href="mailto:shrumu7@gmail.com" style="text-decoration:none;color:inherit;display:inline-flex;align-items:center;gap:6px"><span aria-label="Gmail" style="display:inline-grid;place-items:center;width:30px;height:30px;border-radius:7px;background:#EA4335;color:#fff;font-weight:900;font-size:16px">M</span><b>Gmail</b> · shrumu7@gmail.com</a></div>'''
          if old_contact in s:
              s=s.replace(old_contact,new_contact,1)
          elif 'about-contact' not in s:
              raise SystemExit('About contact row not found')
          p.write_text(s,encoding='utf-8')
          g=Path('app/build.gradle')
          t=g.read_text(encoding='utf-8')
          t=re.sub(r'versionCode\s+\d+','versionCode 21',t,count=1)
          t=re.sub(r"versionName\s+'[^']*'","versionName '1.6.3-ui-fix'",t,count=1)
          g.write_text(t,encoding='utf-8')
          PY
      - name: Verify source before build
        shell: bash
        run: |
          set -e
          grep -q '🎨 All Theme' app/src/main/assets/index.html
          grep -q 'about-contact' app/src/main/assets/index.html
          grep -q 'WhatsApp' app/src/main/assets/index.html
          grep -q 'Gmail' app/src/main/assets/index.html
          grep -q 'shrumu7@gmail.com' app/src/main/assets/index.html
          grep -q 'versionCode 21' app/build.gradle
          grep -q '1.6.3-ui-fix' app/build.gradle
      - name: Commit permanent source fixes
        shell: bash
        run: |
          set -e
          git config user.name 'Business360 Build Bot'
          git config user.email 'actions@github.com'
          git add app/src/main/assets/index.html app/build.gradle
          if git diff --cached --quiet; then
            echo 'Source fixes already committed.'
          else
            git commit -m 'Restore All Theme and About contact icons [skip ci]'
            git push origin HEAD:main
          fi
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        run: gradle --no-daemon clean assembleDebug --stacktrace
      - name: Verify APK contents
        shell: bash
        run: |
          set -e
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -f "$apk"
          unzip -p "$apk" assets/index.html > /tmp/b360-index.html
          grep -q '🎨 All Theme' /tmp/b360-index.html
          grep -q 'about-contact' /tmp/b360-index.html
          grep -q 'WhatsApp' /tmp/b360-index.html
          grep -q 'Gmail' /tmp/b360-index.html
          echo "Verified APK: $(ls -lh "$apk" | awk '{print $5}')"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Business360-Verified-FIX-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
