name: Build Business360 APK
on:
  workflow_dispatch:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply All Theme fix
        shell: bash
        run: |
          set -e
          python3 -c "from pathlib import Path;import base64; p=Path('app/src/main/assets/index.html'); s=p.read_text(encoding='utf-8'); a=s.index('function applyTheme(t, silent=false){'); b=s.index('function page(',a); r=base64.b64decode('').decode(); p.write_text(s[:a]+r+s[b:],encoding='utf-8'); g=Path('app/build.gradle'); t=g.read_text(); import re; t=re.sub(r'versionCode\\s+\\d+','versionCode 20',t,count=1); t=re.sub(r\"versionName\\s+'[^']*'\",\"versionName '1.6.2-all-theme-fix'\",t,count=1); g.write_text(t)"
      - name: Verify source
        shell: bash
        run: |
          set -e
          grep -q "versionCode 20" app/build.gradle
          grep -q "1.6.2-all-theme-fix" app/build.gradle
          grep -q "applyAppBackground(maps\[t\],true)" app/src/main/assets/index.html
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        run: gradle --no-daemon clean assembleDebug --stacktrace
      - name: Verify APK
        shell: bash
        run: |
          set -e
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Business360-AllTheme-FIX-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
