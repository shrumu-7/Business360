name: Build Business360 V48 APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract Business360 ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP=$(find . -maxdepth 2 -type f -name 'Business360_FINAL_V48_ALL_FIXES.zip' -print -quit)

          if [ -z "$ZIP" ]; then
            ZIP=$(find . -maxdepth 2 -type f -name '*.zip' -print -quit)
          fi

          test -n "$ZIP"

          rm -rf _project
          mkdir -p _project

          unzip -q "$ZIP" -d _project

          ROOT=$(find "$PWD/_project" -type f -name settings.gradle -print -quit | xargs -r dirname)

          test -n "$ROOT"

          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Verify Business360 source
        shell: bash
        run: |
          set -euo pipefail

          test -f "$PROJECT_ROOT/app/src/main/assets/index.html"
          test -f "$PROJECT_ROOT/app/build.gradle"
          test -f "$PROJECT_ROOT/business360-debug.keystore"

          grep -q "applicationId 'com.business360.trial'" "$PROJECT_ROOT/app/build.gradle"
          grep -q "versionCode 12" "$PROJECT_ROOT/app/build.gradle"
          grep -q "Business360" "$PROJECT_ROOT/app/src/main/assets/index.html"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          gradle --no-daemon clean assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          test -f "$PROJECT_ROOT/app/build/outputs/apk/debug/app-debug.apk"

          sha256sum "$PROJECT_ROOT/app/build/outputs/apk/debug/app-debug.apk"

      - name: Upload Business360 V48 APK
        uses: actions/upload-artifact@v4
        with:
          name: Business360-Trial-v48-APK
          path: ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
