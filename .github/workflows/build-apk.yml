name: Build Business360 V53 Final APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find V53 ZIP
        run: |
          set -e

          ZIP=$(find . -maxdepth 2 -type f \
            -name 'Business360_V53_FUNCTIONAL_FIX_FINAL*.zip' \
            | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: V53 ZIP not found."
            exit 1
          fi

          echo "ZIP found: $ZIP"
          echo "V53_ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract V53 source
        run: |
          set -e

          rm -rf v53_project
          mkdir v53_project

          unzip -q "$V53_ZIP" -d v53_project

          SETTINGS=$(find v53_project \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android project not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project found: $PROJECT_DIR"

      - name: Copy V53 source into repository
        run: |
          set -e

          rsync -a \
            --exclude='.git/' \
            --exclude='v53_project/' \
            "$PROJECT_DIR/" ./

          echo "V53 source copied into repository."

      - name: Commit source to GitHub
        run: |
          set -e

          git config user.name "Business360 Build Bot"
          git config user.email "actions@github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No source changes."
          else
            git commit -m "Install Business360 V53 source [skip ci]"
            git push
            echo "Source committed to GitHub."
          fi

      - name: Verify source
        run: |
          set -e

          test -f app/build.gradle
          test -f app/src/main/assets/index.html
          test -f settings.gradle
          test -f build.gradle

          grep -q "versionCode 15" app/build.gradle
          grep -q "com.business360.trial" app/build.gradle

          grep -q "function partyOptions" app/src/main/assets/index.html
          grep -q "const nextNo" app/src/main/assets/index.html
          grep -q "function addMove" app/src/main/assets/index.html
          grep -q "function transactionsPage" app/src/main/assets/index.html
          grep -q "Md Sahadul Hoque Rumu" app/src/main/assets/index.html

          echo "Business360 V53 source verified."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        run: |
          gradle --no-daemon clean assembleDebug --stacktrace

      - name: Verify APK
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "APK created successfully."
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Business360-Trial-v53-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
