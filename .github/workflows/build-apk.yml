# Build workflow — verified build for current main source.
name: Build Business360 APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify legacy source before build
        shell: bash
        run: |
          set -euo pipefail
          f=app/src/main/assets/index.html
          test -f "$f"
          test "$(grep -o 'function settingsPageBase(){' "$f" | wc -l)" -eq 1
          test "$(grep -o 'function settingsPage(){' "$f" | wc -l)" -eq 1
          test "$(grep -o 'function openAllTheme(){' "$f" | wc -l)" -eq 1
          grep -q '<div class="brand" id="brand">Business360</div>' "$f"
          grep -q 'Security-first startup' "$f"
          grep -q 'function lockOverlay(){' "$f"
          grep -q 'product-list-card' "$f"
          grep -q 'product-list-name' "$f"
          grep -q 'mailto:shrumu7@gmail.com' "$f"
          grep -q 'wa.me/8801795934394' "$f"
          grep -q 'Md Sahadul Hoque Rumu' "$f"
          grep -q 'applyTheme' "$f"
          grep -q 'applyAppBackground' "$f"
          grep -q 'applyProductBg' "$f"
          grep -q 'applyDashboardStyle' "$f"
          grep -q 'applyButtonTheme' "$f"
          grep -q 'applyPanelBg' "$f"
          echo "LEGACY SOURCE VERIFIED"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build legacy Business360 APK
        run: gradle --no-daemon clean assembleDebug --stacktrace

      - name: Verify packaged legacy APK
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -f "$apk"
          unzip -p "$apk" assets/index.html > /tmp/b360-index.html
          f=/tmp/b360-index.html
          test "$(grep -o 'function settingsPageBase(){' "$f" | wc -l)" -eq 1
          test "$(grep -o 'function settingsPage(){' "$f" | wc -l)" -eq 1
          test "$(grep -o 'function openAllTheme(){' "$f" | wc -l)" -eq 1
          grep -q '<div class="brand" id="brand">Business360</div>' "$f"
          grep -q 'Security-first startup' "$f"
          grep -q 'function lockOverlay(){' "$f"
          grep -q 'product-list-card' "$f"
          grep -q 'product-list-name' "$f"
          grep -q 'mailto:shrumu7@gmail.com' "$f"
          grep -q 'wa.me/8801795934394' "$f"
          grep -q 'Md Sahadul Hoque Rumu' "$f"
          echo "PACKAGED APK VERIFIED: $(ls -lh "$apk" | awk '{print $5}')"

      - name: Upload verified legacy APK
        uses: actions/upload-artifact@v4
        with:
          name: Business360-Legacy-Verified-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
