name: Build Business360 APK
on:
  workflow_dispatch:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore All Theme and About icons
        shell: bash
        run: |
          set -e
          python3 <<'PY'
          from pathlib import Path
          import re
          p=Path('app/src/main/assets/index.html')
          s=p.read_text(encoding='utf-8')
          old='''<button class="btn" onclick="openThemePicker()">🎨 থিম পরিবর্তন</button>'''
          new='''<div class="toolbar"><button class="btn" onclick="openThemePicker()">🎨 থিম পরিবর্তন</button><button class="btn secondary" onclick="openThemePicker()">🎨 All Theme</button></div>'''
          if old in s:
              s=s.replace(old,new,1)
          elif '🎨 All Theme' not in s:
              raise SystemExit('Settings theme button not found')
          old_contact='''<div class="sub" style="margin-top:6px">WhatsApp: 01795934394 · Email: shrumu7@gmail.com</div>'''
          new_contact='''<div class="sub about-contact" style="margin-top:10px;display:flex;gap:10px;flex-wrap:wrap"><a href="https://wa.me/8801795934394" style="text-decoration:none;color:inherit">🟢 <b>WhatsApp</b> · 01795934394</a><a href="mailto:shrumu7@gmail.com" style="text-decoration:none;color:inherit">✉️ <b>Gmail</b> · shrumu7@gmail.com</a></div>'''
          if old_contact in s:
              s=s.replace(old_contact,new_contact,1)
          elif 'about-contact' not in s:
              raise SystemExit('About contact row not found')
          p.write_text(s,encoding='utf-8')
          g=Path('app/build.gradle')
          t=g.read_text(encoding='utf-8')
          t=re.sub(r'versionCode\s+\d+','versionCode 21',t,count=1)
          t=re.sub(r"versionName\s+'[^']*'","versionName '1.6.3-ui-fix'",t,count=1)
          g.write_text(t,encoding='utf-8')
          PY
      - name: Verify source fixes
        shell: bash
        run: |
          set -e
          grep -q '🎨 All Theme' app/src/main/assets/index.html
          grep -q '🟢 <b>WhatsApp</b>' app/src/main/assets/index.html
          grep -q '✉️ <b>Gmail</b>' app/src/main/assets/index.html
          grep -q 'versionCode 21' app/build.gradle
          grep -q '1.6.3-ui-fix' app/build.gradle
          grep -q 'applyAppBackground(maps\[t\],true)' app/src/main/assets/index.html
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        run: gradle --no-daemon clean assembleDebug --stacktrace
      - name: Verify APK
        shell: bash
        run: |
          set -e
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Business360-AllTheme-FIX-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
