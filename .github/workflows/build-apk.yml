name: Build Business360 APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Android source
        run: |
          set -e
          test -f app/build.gradle
          test -f app/src/main/assets/index.html
          test -f app/src/main/AndroidManifest.xml
          test -f settings.gradle
          test -f build.gradle
          test -f gradle.properties
          grep -q 'com.business360.trial' app/build.gradle
          grep -q 'function partyOptions' app/src/main/assets/index.html
          grep -q 'const nextNo' app/src/main/assets/index.html
          grep -q 'function addMove' app/src/main/assets/index.html
          grep -q 'function transactionsPage' app/src/main/assets/index.html
          grep -q 'Md Sahadul Hoque Rumu' app/src/main/assets/index.html
          echo 'Business360 source verification passed.'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle --no-daemon clean assembleDebug --stacktrace

      - name: Verify APK
        run: |
          set -e
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Business360-Trial-APK-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
