name: Build Business360 V53 Final APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout exact repository source
        uses: actions/checkout@v4

      - name: Verify Business360 source before build
        shell: bash
        run: |
          set -euo pipefail

          test -f app/src/main/assets/index.html
          test -f app/build.gradle
          test -f business360-debug.keystore

          grep -q "applicationId 'com.business360.trial'" app/build.gradle
          grep -q "versionCode 15" app/build.gradle
          grep -q "Business360" app/src/main/assets/index.html

          grep -q "function partyOptions" app/src/main/assets/index.html
          grep -q "const nextNo" app/src/main/assets/index.html
          grep -q "function addMove" app/src/main/assets/index.html
          grep -q "function transactionsPage" app/src/main/assets/index.html
          grep -q "Md Sahadul Hoque Rumu" app/src/main/assets/index.html

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle --no-daemon clean assembleDebug --stacktrace

      - name: Verify APK identity
        shell: bash
        run: |
          set -euo pipefail

          test -f app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Business360 APK
        uses: actions/upload-artifact@v4
        with:
          name: Business360-Trial-v53-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
